name: Build Pi music bot test images
on:
  push:
    branches: [codex/music-bot]
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        include:
          - context: .
            tag: music-bot-app
          - context: services/music-bot
            tag: music-bot-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ matrix.context }}
          platforms: linux/arm64
          push: true
          tags: ghcr.io/gouni4967/backspace:${{ matrix.tag }}
          build-args: BACKSPACE_COMMIT=${{ github.sha }}
