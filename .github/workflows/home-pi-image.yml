name: Build Home Backspace Pi Image

on:
  push:
    branches: [codex/home-deployment]
    paths:
      - '.github/workflows/home-pi-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve source revision
        id: revision
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish Pi image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/gouni4967/backspace:ko-pi
            ghcr.io/gouni4967/backspace:ko-pi-${{ github.sha }}
          build-args: BACKSPACE_COMMIT=${{ steps.revision.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/gouni4967/backspace
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=home-pi
          cache-to: type=gha,scope=home-pi,mode=max
