name: Verify music bot
on:
  push:
    branches: [codex/music-queue-check]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 10.34.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @backspace/server exec vitest run src/routes/music.test.ts
      - run: pnpm --filter @backspace/server --filter @backspace/web --no-bail test
        if: success() || failure()
  arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: docker build -t music-bot:ci services/music-bot
      - run: docker run --rm --entrypoint python -v "$PWD/services/music-bot/tests:/tests:ro" music-bot:ci -m unittest discover -s /tests
      - run: docker run --rm --entrypoint sh music-bot:ci -c 'deno --version && ffmpeg -version | head -n 1 && yt-dlp --version && python -c "from livekit import rtc"'
